<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#34c759" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  
  <!-- Outer Target Ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#34c759" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner Precision Ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
  
  <!-- Center Bullseye Dot -->
  <circle cx="32" cy="32" r="4.5" fill="#34c759"/>
  
  <!-- Precision Crosshair Ticks -->
  <line x1="32" y1="5" x2="32" y2="13" stroke="#34c759" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="59" stroke="#34c759" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="13" y2="32" stroke="#34c759" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="59" y2="32" stroke="#34c759" stroke-width="2.5" stroke-linecap="round"/>
</svg>
