<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission | Daily Protocol</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        
        <header>
            <div class="header-content">
                <h1>MISSION</h1>
                <p class="subtitle">Discipline > Motivation</p>
            </div>
            <button id="view-profile-btn" class="action-btn header-btn">VIEW PROFILE</button>
        </header>

        <div class="main-content">
            
            <section class="mission-control">
                <div class="date-header">
                    <div class="date-info">
                        <span id="current-date"></span>
                        <span class="plan-tag" id="plan-tag">Study Plan: Day 1 of 21</span>
                    </div>
                    <span class="status-badge" id="daily-status">Pending</span>
                </div>
                
                <div class="checklist">
                    <div class="task-item" id="item-task-dsa">
                        <input type="checkbox" id="task-dsa">
                        <label for="task-dsa">
                            <div class="task-category">
                                <span>DSA Topic</span>
                                <span class="task-mode-badge" id="dsa-mode-badge">New Topic</span>
                            </div>
                            <span class="task-name" id="task-dsa-name">2D Arrays</span>
                        </label>
                    </div>

                    <div class="task-item" id="item-task-core">
                        <input type="checkbox" id="task-core">
                        <label for="task-core">
                            <div class="task-category">
                                <span>Core CS / Other Subject</span>
                                <span class="task-mode-badge core" id="core-mode-badge">Core Subject</span>
                            </div>
                            <span class="task-name" id="task-core-name">DBMS</span>
                        </label>
                    </div>
                </div>

                <div class="protocol-note">
                    <strong>Rule:</strong> Complete the day's DSA topic & core subject, practice problems or revise concepts, and log completion before midnight.
                </div>

                <button id="save-btn" class="action-btn">COMPLETE DAY</button>
            </section>

            <section class="history-section">
                <h2>Performance History</h2>
                <div class="calendar-grid" id="calendar-grid"></div>
                <div class="legend">
                    <div class="legend-item"><span class="dot red"></span> Missed</div>
                    <div class="legend-item"><span class="dot green"></span> Completed</div>
                    <div class="legend-item"><span class="dot gray"></span> Pending</div>
                    <div class="legend-item"><span class="dot blue"></span> Study Plan</div>
                </div>
            </section>

        </div>

    </div>

    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <img src="profile.jpg" alt="Profile" class="profile-pic-large">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
